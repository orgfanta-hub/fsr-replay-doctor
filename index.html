<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FSR Replay Doctor — 온라인 변환기</title>
<link rel="icon" href="logo.png">
<style>
:root{
  --bg:#0c1017; --bg2:#121826; --card:#161d2b; --card2:#1b2436;
  --ink:#e8edf6; --ink-dim:#93a1b8; --line:#243049;
  --brand:#ff7a18; --brand2:#ffb066; --ok:#31c48d; --warn:#f0b429; --skip:#8a94a6;
  --shadow:0 10px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Pretendard","Segoe UI","Malgun Gothic",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
.bg{position:fixed;inset:0;z-index:-2;
  background:radial-gradient(1200px 600px at 80% -10%,#26314a 0%,transparent 60%),
             radial-gradient(900px 500px at -10% 20%,#2a1c10 0%,transparent 55%),var(--bg);}
.bg::after{content:"";position:absolute;inset:0;opacity:.5;
  background:conic-gradient(from 210deg at 70% 30%,rgba(255,122,24,.10),transparent 30%,rgba(49,196,141,.08) 60%,transparent);
  animation:spin 40s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.wrap{max-width:1120px;margin:0 auto;padding:28px 22px 60px}

header{display:flex;align-items:center;gap:16px;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.logo{width:56px;height:56px;border-radius:16px;background:
  radial-gradient(circle at 35% 30%,#ffb066,#ff7a18 60%,#e8560c);
  box-shadow:0 8px 24px rgba(255,122,24,.4),inset 0 2px 6px rgba(255,255,255,.4);
  display:grid;place-items:center;flex:none;animation:bob 4s ease-in-out infinite}
.logo img{width:70%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
@keyframes bob{50%{transform:translateY(-5px) rotate(-3deg)}}
h1{font-size:23px;font-weight:800;letter-spacing:-.4px}
.sub{color:var(--ink-dim);font-size:13px;margin-top:3px}
.badge{font-size:12px;color:var(--brand2);border:1px solid var(--line);
  padding:7px 13px;border-radius:999px;background:var(--card)}
.langsel{margin-left:auto;background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:999px;padding:7px 10px;font-size:12px;cursor:pointer;outline:none}
.langsel:hover{border-color:var(--brand)}

.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);
  border-radius:18px;box-shadow:var(--shadow);animation:rise .7s .08s cubic-bezier(.2,.8,.2,1) both}
.toolbar{margin-top:22px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--ink);
  padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:600;cursor:pointer;
  transition:transform .15s,box-shadow .2s,background .2s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.35)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(180deg,var(--brand2),var(--brand));color:#241202;border-color:#ff9a44}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.path{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--ink-dim);
  background:#0d1420;border:1px solid var(--line);border-radius:10px;padding:9px 12px;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:200px}

.chips{display:flex;gap:10px;flex-wrap:wrap;padding:0 18px 16px}
.chip{flex:1;min-width:120px;background:#0f1622;border:1px solid var(--line);border-radius:14px;padding:14px 16px;
  transition:transform .2s}
.chip:hover{transform:translateY(-3px)}
.chip .n{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.chip .l{font-size:12px;color:var(--ink-dim);margin-top:2px}
.chip.p .n{color:var(--brand2)} .chip.ok .n{color:var(--ok)} .chip.sk .n{color:var(--skip)}

.ad{margin:18px 0;border:1px dashed var(--line);border-radius:14px;padding:10px;
  display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink-dim);
  font-size:11px;letter-spacing:.5px;background:#0d1420;text-transform:uppercase}
.ad b{color:var(--brand);font-weight:700}

.tablewrap{margin-top:6px;overflow:hidden;border-radius:18px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:#0f1622;text-align:left;padding:13px 14px;
  font-size:11.5px;letter-spacing:.4px;color:var(--ink-dim);text-transform:uppercase;border-bottom:1px solid var(--line)}
tbody td{padding:11px 14px;border-bottom:1px solid #1a2436;vertical-align:middle}
tbody tr{opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s,background .15s}
tbody tr.in{opacity:1;transform:none}
tbody tr:hover{background:#1a2436}
td .old{color:var(--ink-dim);font-size:12px;word-break:break-all}
td .new{color:var(--ink);word-break:break-all}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill.p{background:rgba(255,122,24,.15);color:var(--brand2)}
.pill.ok{background:rgba(49,196,141,.15);color:var(--ok)}
.pill.sk{background:rgba(138,148,166,.15);color:var(--skip)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--brand);cursor:pointer}
.arrow{color:var(--brand);opacity:.7}

.actions{margin-top:16px;padding:16px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar{flex:1;min-width:180px;height:8px;background:#0d1420;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--ok));transition:width .3s}
.note{margin-top:14px;font-size:12px;color:var(--ink-dim);text-align:center;line-height:1.7}
.foot{margin-top:26px;text-align:center;color:var(--ink-dim);font-size:12px}
.foot b{color:var(--brand2)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.banner{display:none;margin-top:14px;padding:13px 16px;border-radius:12px;font-size:12.5px;
  background:rgba(240,180,41,.12);border:1px solid rgba(240,180,41,.4);color:#f5d38a}
.banner.on{display:block}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <header>
    <div class="logo"><img src="logo.png" alt="logo"></div>
    <div>
      <h1>FSR Replay Doctor</h1>
      <div class="sub" data-i18n="sub"></div>
    </div>
    <select id="lang" class="langsel" title="Language">
      <option value="ko">한국어</option><option value="en">English</option>
      <option value="ja">日本語</option><option value="zh">中文</option>
    </select>
    <span class="badge" data-i18n="badge" style="margin-left:0"></span>
  </header>

  <div class="card toolbar">
    <button class="btn primary" id="pick" data-i18n="pick"></button>
    <button class="btn ghost" id="demo" data-i18n="demo"></button>
    <button class="btn ghost" id="refresh" disabled data-i18n="refresh"></button>
    <span class="path" id="path" data-i18n="nopath"></span>
  </div>

  <div class="banner" id="banner"></div>

  <div class="card" style="margin-top:16px">
    <div class="chips" style="padding-top:16px">
      <div class="chip"><div class="n" id="cTotal">0</div><div class="l" data-i18n="cTotal"></div></div>
      <div class="chip p"><div class="n" id="cNeed">0</div><div class="l" data-i18n="cNeed"></div></div>
      <div class="chip ok"><div class="n" id="cDone">0</div><div class="l" data-i18n="cDone"></div></div>
      <div class="chip sk"><div class="n" id="cSkip">0</div><div class="l" data-i18n="cSkip"></div></div>
    </div>
  </div>

  <div class="ad"><b>Ad slot</b> (728×90 leaderboard)</div>

  <div class="card tablewrap">
    <table>
      <thead><tr>
        <th style="width:44px"><input type="checkbox" id="all" checked></th>
        <th data-i18n="thNow"></th><th style="width:40px"></th><th data-i18n="thNew"></th><th style="width:120px" data-i18n="thStatus"></th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="5" style="text-align:center;color:var(--ink-dim);padding:40px" data-i18n="empty"></td></tr></tbody>
    </table>
  </div>

  <div class="card actions">
    <button class="btn" id="selAll" data-i18n="selAll"></button>
    <button class="btn" id="selNone" data-i18n="selNone"></button>
    <button class="btn primary" id="convSel" data-i18n="convSel"></button>
    <button class="btn primary" id="convAll" data-i18n="convAll"></button>
    <button class="btn ghost" id="undo" data-i18n="undo"></button>
    <div class="bar"><i id="prog"></i></div>
  </div>

  <div class="ad"><b>Ad slot</b> (in-feed)</div>

  <div class="note" data-i18n="note"></div>
  <div class="foot" data-i18n="foot"></div>
</div>
<script src="i18n.js"></script>
<script src="rep.js"></script>
<script src="app.js"></script>
</body>
</html>
